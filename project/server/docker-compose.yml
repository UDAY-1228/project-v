version: '3.8'

services:
  # 🗄️ Database: MongoDB
  mongodb:
    image: mongo:latest
    container_name: eims-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ../database/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    environment:
      - MONGO_INITDB_DATABASE=eims_db
    networks:
      - eims-network

  # ⚡ Cache: Redis
  redis:
    image: redis:alpine
    container_name: eims-redis
    ports:
      - "6379:6379"
    networks:
      - eims-network

  # 🧠 Backend: Student/App API
  backend-app:
    build:
      context: ../backend
      dockerfile: dockerfile
    container_name: eims-backend-app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ../backend:/app
    environment:
      - MONGO_URL=mongodb://mongodb:27017/eims_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - mongodb
      - redis
    networks:
      - eims-network

  # 🏢 Backend: Web Portal API
  backend-web:
    build:
      context: ../backend
      dockerfile: dockerfile
    container_name: eims-backend-web
    command: uvicorn web.main:app --host 0.0.0.0 --port 8001
    volumes:
      - ../backend:/app
    environment:
      - MONGO_URL=mongodb://mongodb:27017/eims_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - mongodb
      - redis
    networks:
      - eims-network

  # 💻 Frontend: Admin Web Portal
  frontend-web:
    image: nginx:alpine
    container_name: eims-frontend-web
    volumes:
      - ../frontend/web:/usr/share/nginx/html
    networks:
      - eims-network

  # 📱 Application: Student Angular App
  app-student:
    build:
      context: ../app
      dockerfile: ../frontend/dockerfile
    container_name: eims-app-student
    depends_on:
      - backend-app
    networks:
      - eims-network

  # 🌐 Gateway: Nginx Reverse Proxy
  gateway:
    build:
      context: .
      dockerfile: dockerfile.nginx
    container_name: eims-gateway
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend-web
      - app-student
      - backend-app
      - backend-web
    networks:
      - eims-network

networks:
  eims-network:
    driver: bridge

volumes:
  mongodb_data:
