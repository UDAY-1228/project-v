version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: vid_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./admin-panels/Backend/core-system
      dockerfile: Dockerfile
    container_name: vid_backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/vid_core
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./admin-panels/Frontend/core-system
      dockerfile: Dockerfile
    container_name: vid_frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  mongo_data:
