version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  gateway:
    build:
      context: ..
      dockerfile: server/Dockerfile.gateway
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=vid_db
      - SECRET_KEY=your-secret-key-change-it-in-production
    depends_on:
      - mongodb

  frontend:
    build:
      context: ..
      dockerfile: server/Dockerfile.frontend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - frontend

volumes:
  mongodb_data:
