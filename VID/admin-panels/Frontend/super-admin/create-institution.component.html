<div class="p-12 bg-gray-900 text-white min-h-screen">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-4xl font-black mb-4">Create New Institution</h1>
    <p class="text-gray-400 mb-12">Register a new campus and provision its root administrator.</p>

    <div class="grid grid-cols-2 gap-8 bg-gray-800 p-10 rounded-[3rem] border border-gray-700 shadow-2xl">
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-bold text-gray-400 mb-2">Institution Name</label>
          <input type="text" class="w-full bg-gray-900 border border-gray-700 rounded-2xl py-4 px-6 focus:border-blue-500 outline-none transition-all" placeholder="e.g. Stanford Academy">
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-400 mb-2">Region</label>
          <select class="w-full bg-gray-900 border border-gray-700 rounded-2xl py-4 px-6 focus:border-blue-500 outline-none transition-all">
            <option>North America</option>
            <option>Asia Pacific</option>
            <option>Europe</option>
          </select>
        </div>
      </div>
      
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-bold text-gray-400 mb-2">Admin Email</label>
          <input type="email" class="w-full bg-gray-900 border border-gray-700 rounded-2xl py-4 px-6 focus:border-blue-500 outline-none transition-all" placeholder="admin@academy.edu">
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-400 mb-2">Subscription Tier</label>
          <div class="grid grid-cols-2 gap-4">
            <button class="py-4 border-2 border-blue-600 bg-blue-600/10 rounded-2xl font-black">Enterprise</button>
            <button class="py-4 border border-gray-700 hover:border-gray-500 rounded-2xl font-black transition-all">Standard</button>
          </div>
        </div>
      </div>

      <div class="col-span-2 pt-8">
        <button class="w-full bg-gradient-to-r from-blue-600 to-emerald-600 py-5 rounded-2xl text-xl font-black shadow-xl shadow-blue-600/20 hover:scale-[1.01] active:scale-95 transition-all">Provision & Generate Credentials</button>
      </div>
    </div>
  </div>
</div>
