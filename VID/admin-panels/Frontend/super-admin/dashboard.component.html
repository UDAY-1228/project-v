<div class="p-8 bg-gray-900 text-white min-h-screen">
  <h1 class="text-4xl font-extrabold mb-8 bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">VID Super Admin Dashboard</h1>
  
  <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 hover:border-blue-500 transition-all cursor-pointer">
      <h3 class="text-gray-400 font-semibold mb-2">Total Institutions</h3>
      <p class="text-3xl font-bold">{{ stats.institutions }}</p>
    </div>
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 hover:border-emerald-500 transition-all cursor-pointer">
      <h3 class="text-gray-400 font-semibold mb-2">Active Users</h3>
      <p class="text-3xl font-bold font-mono">{{ stats.active_users }}</p>
    </div>
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 hover:border-red-500 transition-all cursor-pointer">
      <h3 class="text-gray-400 font-semibold mb-2">System Status</h3>
      <p class="text-3xl font-bold text-emerald-400">{{ stats.system_monitoring }}</p>
    </div>
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 hover:border-purple-500 transition-all cursor-pointer">
      <h3 class="text-gray-400 font-semibold mb-2">Recent Regs</h3>
      <p class="text-3xl font-bold">{{ stats.recent_registrations }}</p>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    <div class="bg-gray-800/50 p-6 rounded-2xl border border-gray-700 backdrop-blur-sm">
      <h2 class="text-2xl font-bold mb-4">Institution Analytics</h2>
      <div class="h-64 flex items-center justify-center text-gray-500 italic">
        [Dynamic AI Analytics Chart]
      </div>
    </div>
    
    <div class="bg-gray-800/50 p-6 rounded-2xl border border-gray-700">
      <h2 class="text-2xl font-bold mb-4">Create New Institution</h2>
      <button class="w-full py-4 rounded-xl bg-blue-600 hover:bg-blue-700 font-bold transition-all shadow-lg hover:shadow-blue-500/20 mb-4">Launch Institution Setup</button>
      <button class="w-full py-4 rounded-xl border border-gray-600 hover:bg-gray-700 font-bold transition-all">Audit Security Logs</button>
    </div>
  </div>
</div>
